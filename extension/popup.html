<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Analyzer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <div class="popup-shell">
      <p class="eyebrow">SIGNALHIRE INTELLIGENCE</p>
      <h2>Review job posting</h2>
      <details class="api-settings">
        <summary>API connection</summary>
        <label>API base URL<input id="apiUrl" value="https://ai-aware-recruitment-fraud-detection-api.onrender.com" /></label>
        <small>Use the updated API deployment, or enter http://localhost:8000 while testing locally.</small>
      </details>
      <button id="extractButton" type="button">Extract Visible Job Data</button>
      <div id="statusText" class="status-text">Extraction is user-triggered and stays on this page until you analyze.</div>
      <div id="review" class="review-form" hidden>
        <label>Title<input id="title" /></label>
        <label>Company<input id="company" /></label>
        <label>Location<input id="location" /></label>
        <label>Salary<input id="salary" /></label>
        <label>Website<input id="website" /></label>
        <label>Application URL<input id="application_url" /></label>
        <label>Description<textarea id="description" rows="7"></textarea></label>
        <details class="comparison-review">
          <summary>Compare another source (optional)</summary>
          <label>Source<input id="compare_platform" placeholder="Indeed, company site…" /></label>
          <label>Other title<input id="compare_title" /></label>
          <label>Other company<input id="compare_company" /></label>
          <label>Other location<input id="compare_location" /></label>
          <label>Other salary<input id="compare_salary" /></label>
          <label>Other listing URL<input id="compare_url" /></label>
        </details>
        <button id="analyzeButton" type="button">Analyze Reviewed Job</button>
      </div>
      <div id="results" class="result-box"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
